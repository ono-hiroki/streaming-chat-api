version: "3.9"

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/var/www/src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/var/www/src
    working_dir: /var/www/src

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload